labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is public. If you have lost lists or cannot sign in, please email support@oldworldrankings.com instead so we can look at your account privately.
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a Skaven list
        2. Add Clanrats
        3. ...
  - type: markdown
    attributes:
      value: |
        **Attach the list if you can.** It is the quickest way for us to reproduce this. Open the list, tap **Share**, then either **Copy Text** and paste it below, or **Download** and drag the file in.

        <img src="https://raw.githubusercontent.com/hammerhub-com/hammerhub-community/main/docs/images/share-list.png" alt="The Share list sheet with Copy Text and Download" width="380">
  - type: textarea
    id: list_export
    attributes:
      label: List export
      description: Paste the copied text here, or drag the downloaded file into this box.
  - type: input
    id: platform
    attributes:
      label: Where did it happen
      placeholder: Web (desktop), Web (mobile browser), iOS app or Android app
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Filled in for you if you came from the app.
