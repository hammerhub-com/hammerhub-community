labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is public. If you have lost lists or cannot sign in, please email support@oldworldrankings.com instead so we can look at your account privately.
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a Skaven list
        2. Add Clanrats
        3. ...
  - type: input
    id: platform
    attributes:
      label: Where did it happen
      placeholder: Web (desktop), Web (mobile browser), iOS app or Android app
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      description: Settings, About.
