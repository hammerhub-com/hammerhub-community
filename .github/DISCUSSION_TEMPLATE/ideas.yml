body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation before the solution. It helps us find the best fix.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where would you use it
      options:
        - Building lists
        - At the table (game view)
        - Reviewing or printing lists
        - Tournaments
        - Other
