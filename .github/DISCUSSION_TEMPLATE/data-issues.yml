labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us get the Old World Rankings Battle Builder data right. This is public, so please do not paste private information.
  - type: input
    id: faction
    attributes:
      label: Army or faction
      placeholder: Skaven, Warriors of Chaos, Dwarfen Mountain Holds...
    validations:
      required: true
  - type: input
    id: unit
    attributes:
      label: Unit, option or item
      placeholder: Great Stag, Crusader's Lance, Rattling Gun...
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: What does the builder show, and what should it show?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Book and page, errata, or a link. This is the fastest way to get it fixed.
      placeholder: Forces of Fantasy p. 45, Arcane Journal errata 2025...
  - type: markdown
    attributes:
      value: |
        **Attach the list if you can.** It is the quickest way for us to reproduce this. Open the list, tap **Share**, then either **Copy Text** and paste it below, or **Download** and drag the file in.

        <img src="https://raw.githubusercontent.com/hammerhub-com/hammerhub-community/main/docs/images/share-list.png" alt="The Share list sheet with Copy Text and Download" width="380">
  - type: textarea
    id: list_export
    attributes:
      label: List export
      description: Paste the copied text here, or drag the downloaded file into this box.
  - type: input
    id: platform
    attributes:
      label: Where did you see it
      placeholder: Web, iOS app or Android app
  - type: input
    id: version
    attributes:
      label: Version
      description: Filled in for you if you came from the app.
